packages:
  - 'packages/*'
  # Scaffold template: contains {%...%} placeholders, not a runnable workspace package.
  - '!packages/pix-component-template'
# Documentation aggregation creates intentional package cycles (pix-core ↔ pix-a11y,
# pix-color-scheme-selector ↔ pix-foundations): the edges exist only so each docs site can
# import the shared template and the sibling examples. Breaking them is tracked as follow-up
# (ADR-020 / DSL-09); until then recursive tasks run in an arbitrary order.
ignoreWorkspaceCycles: true

allowBuilds:
  '@vscode/vsce-sign': false
  esbuild: true
  keytar: false
minimumReleaseAgeExclude:
  - vite@8.2.1

# Supply-chain overrides: force patched versions of transitive deps flagged by
# GitHub Dependabot (brace-expansion DoS, js-yaml omap CPU) until upstream
# ranges resolve them. Scoped by declared range so different majors coexist.
overrides:
  'brace-expansion@^1.1.7': '1.1.18'
  'brace-expansion@^5.0.5': '5.0.9'
  'js-yaml@^4.2.2': '4.3.1'
