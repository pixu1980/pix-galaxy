name: Release

on:
  push:
    tags:
      - '@pix-galaxy/*@*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
        with:
          version: 11.9.0
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile

      # Extract package directory from tag: @pix-galaxy/pix-command@0.2.0 → packages/pix-command
      - name: Extract package
        id: pkg
        run: |
          TAG="${{ github.ref_name }}"
          NAME="${TAG%@*}"              # @pix-galaxy/pix-command
          DIR="packages/${NAME##*/}"     # packages/pix-command
          echo "name=$NAME" >> $GITHUB_OUTPUT
          echo "dir=$DIR" >> $GITHUB_OUTPUT

      - name: Build library
        working-directory: ${{ steps.pkg.outputs.dir }}
        run: pnpm build:lib

      - name: Publish to npm
        working-directory: ${{ steps.pkg.outputs.dir }}
        run: pnpm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
