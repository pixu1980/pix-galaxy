name: Release

# NOTE (ADR-018): releases are published LOCALLY via `pnpm release`.
# This workflow no longer publishes to npm with a NPM_TOKEN secret.
# It exists only to run a release-quality gate when a release tag is
# pushed: typecheck, tests, and library build for the tagged package.
#
# Local release flow:
#   pnpm release          # bump + CHANGELOG + tag + publish
#   pnpm release:dry      # preview only

on:
  push:
    tags:
      - '@pix-galaxy/*@*'

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.20.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Extract package directory from tag: @pix-galaxy/pix-command@0.2.0 → packages/pix-command
      - name: Extract package
        id: pkg
        env:
          TAG: ${{ github.ref_name }}
        run: |
          NAME="${TAG%@*}"              # @pix-galaxy/pix-command
          DIR="packages/${NAME##*/}"     # packages/pix-command
          echo "name=$NAME" >> $GITHUB_OUTPUT
          echo "dir=$DIR" >> $GITHUB_OUTPUT

      - name: Typecheck package
        working-directory: ${{ steps.pkg.outputs.dir }}
        run: pnpm typecheck

      - name: Test package
        working-directory: ${{ steps.pkg.outputs.dir }}
        run: pnpm test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs:
      - test
    permissions:
      contents: read

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.20.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Extract package directory from tag
      - name: Extract package
        id: pkg
        env:
          TAG: ${{ github.ref_name }}
        run: |
          NAME="${TAG%@*}"
          DIR="packages/${NAME##*/}"
          echo "dir=$DIR" >> $GITHUB_OUTPUT

      - name: Build library
        working-directory: ${{ steps.pkg.outputs.dir }}
        run: pnpm build:lib
