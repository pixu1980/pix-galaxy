name: Release

# NOTE (ADR-018): releases are published LOCALLY via `pnpm release`.
# This workflow no longer publishes to npm with a NPM_TOKEN secret.
# It exists only to run a release-quality gate when a release tag is
# pushed: typecheck, tests, and library build for the tagged package.
#
# Local release flow:
#   pnpm release          # bump + CHANGELOG + tag + publish
#   pnpm release:dry      # preview only

on:
  push:
    tags:
      - '@pix-galaxy/*@*'

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
        with:
          version: 11.20.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      # Extract package directory from tag: @pix-galaxy/pix-command@0.2.0 → packages/pix-command
      - name: Extract package
        id: pkg
        env:
          TAG: ${{ github.ref_name }}
        run: |
          NAME="${TAG%@*}"              # @pix-galaxy/pix-command
          DIR="packages/${NAME##*/}"     # packages/pix-command
          echo "name=$NAME" >> $GITHUB_OUTPUT
          echo "dir=$DIR" >> $GITHUB_OUTPUT

      - name: Typecheck package
        working-directory: ${{ steps.pkg.outputs.dir }}
        run: pnpm typecheck

      - name: Test package
        working-directory: ${{ steps.pkg.outputs.dir }}
        run: pnpm test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs:
      - test
    permissions:
      contents: read

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
        with:
          version: 11.20.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      # Extract package directory from tag
      - name: Extract package
        id: pkg
        env:
          TAG: ${{ github.ref_name }}
        run: |
          NAME="${TAG%@*}"
          DIR="packages/${NAME##*/}"
          echo "dir=$DIR" >> $GITHUB_OUTPUT

      - name: Build library
        working-directory: ${{ steps.pkg.outputs.dir }}
        run: pnpm build:lib
