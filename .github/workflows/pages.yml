# GitHub Pages Deployment
#
# Each package has its own GitHub Pages site deployed at:
#   https://pixu1980.github.io/<package-name>/
#
# For now, per-package docs are built locally or via the release workflow.
# To enable monorepo-level pages, create a root site/ aggregator that
# collects all package dist/ outputs into a single deployable directory.
#
# See packages/*/README.md for links to individual docs sites.

name: Deploy GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and Deploy Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
        with:
          version: 11.9.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build all packages
        run: pnpm -r --if-present run build:lib

      - name: Build docs sites
        run: pnpm -r --if-present run build:site

      - name: Aggregate docs into site/
        run: |
          mkdir -p site
          for dir in packages/pix-*; do
            if [ -d "$dir/dist" ]; then
              pkg=$(basename "$dir")
              cp -r "$dir/dist" "site/$pkg"
            fi
          done
          cat > site/index.html << 'EOF'
          <!DOCTYPE html>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width">
          <title>pix-galaxy</title>
          <style>
            body { font-family: system-ui, sans-serif; max-width: 40rem; margin: 2rem auto; padding: 0 1rem; }
            h1 { font-size: 1.5rem; }
            ul { list-style: none; padding: 0; }
            li { margin: .5rem 0; }
            a { color: #0066cc; }
          </style>
          <h1>pix-galaxy</h1>
          <p>Zero-runtime-dependency vanilla JavaScript Web Components.</p>
          <ul>
            <li><a href="pix-accent-color-selector/">pix-accent-color-selector</a></li>
            <li><a href="pix-color-scheme-selector/">pix-color-scheme-selector</a></li>
            <li><a href="pix-a11y-panel/">pix-a11y-panel</a></li>
            <li><a href="pix-highlighter/">pix-highlighter</a></li>
          </ul>
          <hr>
          <p><a href="https://github.com/pixu1980/pix-galaxy">GitHub</a></p>
          EOF

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
