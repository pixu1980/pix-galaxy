name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    name: Test, Typecheck, Build
    runs-on: ubuntu-latest

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@b09bb98c54c4d5a2f8e4b1c7a0f3e6d9c2b5a8f1d # v2.20.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5c7e8f9a1b2c3d4e5f6a7b8c9d0e1f2a3 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd9b3a2c1e4f5d6a7b8c9e0f1a2b3c4d5e6f # v6.0.10
        with:
          version: 11.9.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Run tests
        run: pnpm -r --if-present run test

      - name: Run typecheck
        run: pnpm -r --if-present run typecheck

      - name: Build all packages
        run: pnpm -r --if-present run build:lib

      - name: Lint
        run: pnpm -r --if-present run lint

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@b09bb98c54c4d5a2f8e4b1c7a0f3e6d9c2b5a8f1d # v2.20.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5c7e8f9a1b2c3d4e5f6a7b8c9d0e1f2a3 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd9b3a2c1e4f5d6a7b8c9e0f1a2b3c4d5e6f # v6.0.10
        with:
          version: 11.9.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run e2e tests
        run: pnpm exec playwright test
