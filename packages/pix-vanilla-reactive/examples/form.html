<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>pix-vanilla-reactive — Form example</title>
    <style>
      body {
        font:
          16px/1.6 system-ui,
          sans-serif;
        max-width: 34rem;
        margin: 3rem auto;
        padding: 0 1rem;
      }
      [data-part='field'] {
        display: block;
        margin-bottom: 0.75rem;
      }
      [data-part='input'] {
        display: block;
        width: 100%;
        box-sizing: border-box;
        font: inherit;
        padding: 0.4rem 0.6rem;
      }
      [data-part='error'] {
        color: oklch(55% 0.2 25);
        font-size: 0.85rem;
        min-height: 1.2em;
      }
      button {
        font: inherit;
        padding: 0.45rem 1rem;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <h1>Form</h1>
    <p>
      Store-driven form with pure-JS validation, <code>model</code> bindings and
      <code>aria-live</code> error output.
    </p>
    <div id="app"></div>
    <script type="module">
      import { Store, Signal, effect, html, render, createTickState } from '../src/index.js';

      const store = new Store({
        email: '',
        name: '',
        errors: null,
        sent: false,
      });
      const tick = createTickState(store);

      const validators = {
        required: (v) => (v?.trim() ? null : 'This field is required'),
        email: (v) => (/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v) ? null : 'Enter a valid email'),
      };

      function submit() {
        const data = store.snapshot();
        const errors = {};
        for (const [field, fn] of Object.entries({
          name: validators.required,
          email: validators.email,
        })) {
          const msg = fn(data[field]);
          if (msg) errors[field] = msg;
        }
        if (Object.keys(errors).length) {
          store.state.errors = errors;
          return;
        }
        store.state.errors = null;
        store.state.sent = true;
      }

      const view = new Signal.Computed(() => {
        tick.get();
        const { email, name, errors, sent } = store.snapshot();
        const result = html`
          <form
            @submit=${(e) => {
              e.preventDefault();
              submit();
            }}
            novalidate
          >
            <label data-part="field">
              <span>Name</span>
              <input
                data-part="input"
                model=${{
                  get: () => name,
                  set: (v) => {
                    store.state.name = v;
                  },
                }}
              />
              <span data-part="error" aria-live="polite">{{ nameError }}</span>
            </label>
            <label data-part="field">
              <span>Email</span>
              <input
                data-part="input"
                type="email"
                model=${{
                  get: () => email,
                  set: (v) => {
                    store.state.email = v;
                  },
                }}
              />
              <span data-part="error" aria-live="polite">{{ emailError }}</span>
            </label>
            <button type="submit">Send</button>
            <p aria-live="polite">{{ status }}</p>
          </form>
        `;
        result._context = {
          nameError: errors?.name ?? '',
          emailError: errors?.email ?? '',
          status: sent ? 'Sent! ✓' : '',
        };
        return result;
      });

      effect(() => render(view.get(), document.querySelector('#app')));
    </script>
  </body>
</html>
