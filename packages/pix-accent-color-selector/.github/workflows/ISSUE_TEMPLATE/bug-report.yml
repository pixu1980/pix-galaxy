name: Bug report
description: Report a defect or regression in pix-accent-color-selector
title: '[Bug]: '
labels:
  - bug
  - needs-triage
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please provide a minimal, reproducible description.

  - type: input
    id: summary
    attributes:
      label: Summary
      description: One-line description of the problem.
      placeholder: Accent selector stops responding after clicking an option
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: What steps reproduce the issue?
      placeholder: |
        1. Add a <pix-accent-color-selector> element
        2. Click rose
        3. Click mint
        4. Observe...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: The accent should switch to mint.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Browser, package version, OS and anything else relevant.
      placeholder: npm package version, browser version, OS, framework or bundler
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues first
          required: true
        - label: I can reproduce this on the latest published version
          required: false
